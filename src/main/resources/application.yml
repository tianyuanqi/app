# 公共配置：各环境共用项
spring:
  application:
    name: app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 210MB
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 应用自定义配置（密钥与路径由环境变量注入）
app:
  jwt:
    secret: ${JWT_SECRET:Yuanqi_Photo_Secret_Key_2026_ChangeMe_32B}
    access-expire-ms: ${JWT_ACCESS_EXPIRE_MS:900000}
    refresh-expire-ms: ${JWT_REFRESH_EXPIRE_MS:604800000}
  auth:
    max-failed-login: 5
    lock-minutes: 15
    access-expire-ms: ${JWT_ACCESS_EXPIRE_MS:900000}
    session-expire-ms: ${AUTH_SESSION_EXPIRE_MS:604800000}
    allowed-origins: ${APP_ALLOWED_ORIGINS:https://localhost:5173}
    secure-cookies: ${APP_SECURE_COOKIES:true}
    rate-limit-pepper: ${AUTH_RATE_LIMIT_PEPPER:change-this-rate-limit-pepper}
  upload:
    dir: ${APP_UPLOAD_DIR:./private-media}

# 本地开发环境
# 密码来源（任选其一）：
# 1) 环境变量 DB_PASSWORD（IDEA Run Configuration → Environment variables）
# 2) 复制 application-local-secrets.yml.example → application-local-secrets.yml 并填写密码（已 gitignore）
spring:
  config:
    import: optional:classpath:application-local-secrets.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

app:
  upload:
    dir: ${APP_UPLOAD_DIR:/Users/yuanqi/devTools/img}

implemented_capabilities:
  authentication:
    - 邮箱验证码发送、注册、登录、Refresh 旋转与 Logout
    - Access 15 分钟、Session 固定 7 天、HttpOnly Cookie、CSRF 与 Origin 校验
    - 登录失败锁定、验证码及登录限流、禁用账号撤销 Session
  profile:
    - 私有当前用户资料与公开 Profile 分离
    - 公开 uid、ETag 乐观并发、Asia/Shanghai 年龄计算、头像上传
  photo_and_media:
    - 草稿、提交、撤回、驳回重提、公开与待审修改并存
    - 1 至 9 图顺序、首图封面、私有原图与 Web 衍生图、失败重试入口
    - 作者视图、公开详情、分类与 Unicode 归一化标签
  moderation:
    - 待审队列、目标详情、历史、批准、驳回、下架及恢复
    - 允许管理员自审并记录 selfReview
    - 审核事件与乐观并发版本
  interaction:
    - 唯一点赞、取消点赞、允许作者自赞
    - 两级评论、回复分页、删除占位与管理员删除
  discovery:
    - 公开状态过滤、五类关键词字段、分类标签组合与稳定页码分页
  governance:
    - 管理员只治理普通用户，记录原因、操作者、动作与时间
    - 查询返回隔离邮箱和完整生日

integration_readiness:
  backend_overall_ready: false
  frontend_can_integrate: false
  tester_can_accept: false
  reason: 核心路径已物化并可生成运行时契约，但冻结契约要求的幂等、EXIF、邮件生产适配、补偿清理与契约级测试尚未闭环。

blocking_gaps:
  - id: V1-BE-GAP-001
    priority: P0
    area: idempotency
    summary: 除验证码发送的格式校验外，写 Operation 尚未实现统一 Idempotency-Key 持久化、同载荷重放和冲突语义。
  - id: V1-BE-GAP-002
    priority: P0
    area: contract
    summary: OpenAPI 尚未为每个 Operation 闭合 ErrorCode、错误响应、幂等 Header 与全部 DTO 约束。
  - id: V1-BE-GAP-003
    priority: P0
    area: testability
    summary: 当前仅 9 个基础测试，缺少认证会话、权限、领域状态机、并发、分页、Migration 与 OpenAPI 契约集成测试。
  - id: V1-BE-GAP-004
    priority: P1
    area: exif
    summary: 尚未实现 EXIF 提取、逐图拍摄时间覆盖、未来 EXIF 警告及 Asia/Shanghai 序列化闭环。
  - id: V1-BE-GAP-005
    priority: P1
    area: mail
    summary: 仅有本地 Mail Sink；生产邮件 Port 未接入真实 Provider。
  - id: V1-BE-GAP-006
    priority: P1
    area: media_cleanup
    summary: 媒体处理、失败重试和基础删除已实现，但孤儿对账、跨 DB/文件补偿、彻底清理证据及 Worker 确定性尚未完整验证。
  - id: V1-BE-GAP-007
    priority: P1
    area: response_compatibility
    summary: 管理员彻底删除返回类型、头像裁剪参数等消费者细节仍需按冻结目标契约补齐并复审。
  - id: V1-BE-GAP-008
    priority: P2
    area: persistence
    summary: 复合主键实体启动时仍有 MyBatis-Plus 无 TableId 警告，必须持续禁止误用 ById API。
  - id: V1-BE-GAP-009
    priority: P2
    area: security_hardening
    summary: 启动日志仍出现未使用的 Spring 默认内存用户密码，生产加固前应移除默认认证 Bean。


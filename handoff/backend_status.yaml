integration_matrix:
  - { invariant: Session 签发、解析、固定期限、Refresh 旋转与 Logout 幂等, test: BackendP0IntegrationMatrixTest.Session签发解析旋转退出形成完整闭环 }
  - { invariant: Refresh 重放吊销整个 Session, test: BackendP0IntegrationMatrixTest.Refresh重放吊销整个Session且旧凭证不可恢复 }
  - { invariant: 草稿、提交、撤回、驳回重提、自审、公开版本原子替换与 ETag 递增, test: BackendP0IntegrationMatrixTest.作品审核状态机公开版本替换与每次Mutation强ETag递增 }
  - { invariant: 真实 HTTP Mutation 返回新 ETag 且旧 If-Match 返回 412, test: BackendP0IntegrationMatrixTest.真实HTTPMutation返回新ETag且旧条件版本失败 }
  - { invariant: 所有权和非待审目标统一 RESOURCE_NOT_FOUND, test: BackendP0IntegrationMatrixTest.所有权防枚举与目标状态校验统一RESOURCE_NOT_FOUND }
  - { invariant: 我的作品页码分页稳定且无跨页重复, test: BackendP0IntegrationMatrixTest.我的作品稳定分页使用更新时间与公开ID确定性排序 }
  - { invariant: 审核队列同时间使用 revisionId 稳定排序, test: BackendP0IntegrationMatrixTest.审核队列同提交时间按Revision公开ID稳定排序 }
  - { invariant: 作者 Revision 与审核 Target 返回分类、标签和完整有序 Web 媒体, test: BackendP0IntegrationMatrixTest.作者Revision与审核Target无损返回分类标签和有序Web媒体 }
  - { invariant: 分类公开 ID 为真实唯一字符串并经草稿创建、Revision 读取和二次保存无损往返, test: BackendP0IntegrationMatrixTest.分类公开ID序列化与作品草稿往返保持一致 }
  - { invariant: 待审目标 Web 媒体仅作者和管理员可读，普通他人、匿名与无关私有媒体保持防枚举, test: BackendP0IntegrationMatrixTest.待审目标Web媒体权限矩阵保持最小授权 }
  - { invariant: 有效 1200×1200 PNG 从 PROCESSING 到 READY 并生成 JPEG 衍生图, test: MediaProcessorIntegrationTest.有效1200方形PNG从PROCESSING进入READY并生成JPEG衍生图 }
  - { invariant: 损坏媒体确定失败且暂存清理，临时处理失败可重试并保持 ClientUploadId 单一 Asset, test: MediaProcessorIntegrationTest }
  - { invariant: 完整、缺失、损坏和未来 EXIF 均按单张媒体独立处理且不阻断合法图像进入 READY, test: MediaProcessorIntegrationTest }
  - { invariant: "逐图候选、手工覆盖与清空无跨媒体污染，未来手工拒绝且有效时间固定序列化为 +08:00", test: ExifTimeRulesIntegrationTest }
  - { invariant: 逐图业务与 Bean Validation 错误可稳定定位数组项、公开 mediaId 和字段且多错误不覆盖, test: ExifErrorLocationIntegrationTest }
  - { invariant: 未认证及普通用户先于资源和 ETag 校验失败, test: AdminContractSecurityTest }

implemented_capabilities:
  authentication:
    - 邮箱验证码发送、注册、登录、Refresh 旋转与 Logout
    - Access 15 分钟、Session 固定 7 天、HttpOnly Cookie、CSRF 与 Origin 校验
    - 登录失败锁定、验证码及登录限流、禁用账号撤销 Session
  profile:
    - 私有当前用户资料与公开 Profile 分离
    - 公开 uid、ETag 乐观并发、Asia/Shanghai 年龄计算、头像上传
  photo_and_media:
    - 草稿、提交、撤回、驳回重提、公开与待审修改并存
    - 1 至 9 图顺序、首图封面、私有原图与 Web 衍生图、失败重试入口
    - 作者视图、公开详情、分类与 Unicode 归一化标签
    - 有效 1200×1200 PNG 确定进入 READY，并生成 MIME 为 image/jpeg 的 Web 衍生图
    - 作者 Revision 与审核 Target 返回 category、tags、有序 media、Web 引用和非空 parameters
    - 分类接口返回 11 个唯一非空公开 categoryId，草稿二次保存保持分类无损
    - 待审 Target 的 BEARER_FETCH Web 媒体仅向作者和具备审核权限的管理员开放
    - 每张媒体独立提取拍摄时间、机身、镜头、焦距、光圈、快门和 ISO 候选；缺失或解析失败不阻断处理
    - 作者可逐图覆盖或清空参数；未来 EXIF 只警告不写入有效拍摄时间，未来手工时间稳定拒绝
    - 有效拍摄时间按 Asia/Shanghai 比较并固定序列化为带 +08:00 偏移的 ISO-8601
    - 逐图参数校验通过既有 ErrorResult 返回零基数组路径、公开 mediaId 和稳定字段/条目错误代码
  moderation:
    - 待审队列、目标详情、历史、批准、驳回、下架及恢复
    - 允许管理员自审并记录 selfReview
    - 审核事件与乐观并发版本
  interaction:
    - 唯一点赞、取消点赞、允许作者自赞
    - 两级评论、回复分页、删除占位与管理员删除
  discovery:
    - 公开状态过滤、五类关键词字段、分类标签组合与稳定页码分页
  governance:
    - 管理员只治理普通用户，记录原因、操作者、动作与时间
    - 查询返回隔离邮箱和完整生日


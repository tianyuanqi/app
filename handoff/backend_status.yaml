    web_derivative_sha256: 34fc9dde3650b0e15a73197c33cc4cd4e955a484bdd1d68eb13047489529bf2b
  FE-V1-CONTRACT-003:
    status: closed
    evidence:
      - 真实 HTTP 作者 PENDING Revision 返回 cat_landscape、Photo/风光、有序首图、BEARER_FETCH 和 parameters
      - 真实 HTTP 管理员 ModerationTarget 返回相同完整目标媒体，且无 original、staging 或本机路径
      - 运行时 OpenAPI 的 AuthorRevisionView 与 ModerationTargetView 已引用完整嵌套 DTO，旧 mediaIds 字段不存在


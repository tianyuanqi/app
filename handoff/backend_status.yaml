known_issues:
  - id: AUTH-001
    priority: P0
    area: refresh_token
    summary: Refresh JWT jti does not match auth_session.jti, so a newly issued refresh token returns 40102.
    evidence: JwtService creates a custom jti claim and buildToken later overwrites the standard JWT ID; AuthSessionService reads claims.get('jti') and queries the database by the original generated jti.
    impact: Access tokens work until expiry, but token refresh and documented rotation cannot be used.

  - id: AUTH-002
    priority: P0
    area: session_revocation
    summary: Logout may return 200 without revoking the database session.
    evidence: revokeByRefreshToken treats a missing session as idempotent success; the user1 and admin acceptance sessions remained active in auth_session after their logout calls.
    impact: Frontend cannot rely on logout to invalidate refresh sessions.

  - id: AUTH-003
    priority: P0
    area: authentication_security
    summary: Login failure counters/lock and refresh reuse revocation are updated inside transactions that rethrow RuntimeException.
    evidence: AuthService.login and refresh use rollbackFor=Exception and throw BusinessException after security updates.
    impact: Security state updates are at high risk of rollback; lock and reuse protection require correction and re-verification.

  - id: MEDIA-001
    priority: P1
    area: static_resources
    summary: V5 seed photo and avatar URLs point to files that are not present.
    evidence: GET seed photo/avatar returned HTTP 500; NoResourceFoundException is handled as INTERNAL_ERROR instead of 404.
    impact: Seed feed/profile cards cannot render their images and missing resources produce the wrong HTTP status.

  - id: DB-001
    priority: P1
    area: seed_migration
    summary: V5 uses fixed category IDs that already have different meanings in an existing database.
    evidence: Seed titles expected as landscape/portrait/street map to existing categories such as 未指定, 建筑, 自然风光.
    impact: Seed content category semantics are incorrect on an existing schema.

  - id: PHOTO-001
    priority: P1
    area: category_mapping
    summary: Some photo cards return category null.
    evidence: Public feed smoke returned category=null for V5 seed records.
    impact: Frontend must tolerate null until data/mapping repair; it should not invent a category.

  - id: FILE-001
    priority: P2
    area: upload_storage
    summary: The local upload default is a machine-specific absolute path and file writes are not transactionally coupled to database writes.
    impact: Environment portability and orphan-file cleanup need explicit handling.

  - id: PERF-001
    priority: P2
    area: query_performance
    summary: PhotoAssembler performs per-record author/category lookups and hot-tags loads published IDs and relations into memory.
    impact: Feed, search, walls and hot tags will degrade as data volume grows.

  - id: BUILD-001
    priority: P2
    area: build
    summary: HomeService compiles with a deprecated API warning.

  - id: SEC-001
    priority: P2
    area: spring_security
    summary: Startup still creates an unused development in-memory user and logs a generated password.
    impact: JWT routes use the custom filter chain, but the unused default authentication bean should be removed before production hardening.

  - id: ORM-001
    priority: P3
    area: mybatis_plus
    summary: PhotoTagRelation has a composite primary key but no TableId, producing startup warnings.
    impact: Wrapper-based operations work; ById APIs must not be used for this entity.

recommended_priorities:
  - order: 1
    scope: Fix AUTH-001, AUTH-002 and AUTH-003 together, then re-verify login, refresh rotation, reuse detection, logout and lock policy.
  - order: 2
    scope: Repair V5 category seeding with a new append-only migration; restore valid seed media or stop returning nonexistent URLs; map missing static resources to 404.
  - order: 3
    scope: Validate upload and moderation write flows with isolated acceptance data, including file cleanup behavior.
  - order: 4
    scope: Address N+1 queries, hot-tags memory aggregation, environment portability and ORM/build warnings before scale work.

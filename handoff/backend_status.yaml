p0_closure:
  V1-BE-GAP-001:
    status: closed
    evidence: 目标 Mutation 已接入事务内持久化；覆盖合法性、24 小时或验证码 10 分钟保留、同载荷重放、异载荷冲突、并发唯一性、最多等待 10 秒以及 ETag/Location 重放。
  V1-BE-GAP-002:
    status: closed
    evidence: 51 个 Operation 由显式注册表逐项覆盖；336 个 4xx/5xx 响应各自引用 Operation/status 独立 ErrorResult Schema，机器检查无全局宽泛 ErrorCode 引用；认证、必需 Header、ETag 与关键 DTO Validation 已进入运行时 OpenAPI。
    remaining: 无 P0 剩余项。
  V1-BE-GAP-003:
    status: closed
    evidence: BackendP0IntegrationMatrixTest 以 7 个可回滚测试覆盖 Session 签发/解析/旋转/重放/退出、草稿/提交/撤回/驳回重提/两次批准及公开版本替换、真实 HTTP Mutation ETag 与旧版本 412、两类稳定分页、所有权与审核目标防枚举；AdminContractSecurityTest 覆盖认证和角色优先顺序。
    remaining: 无 P0 剩余项。


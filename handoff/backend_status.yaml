  FE-V1-RUNTIME-002:
    status: closed
    evidence:
      - 真实 HTTP multipart 上传有效 1200×1200 PNG 返回 202/PROCESSING，随后 GET 状态为 READY
      - READY 返回 width=1200、height=1200、web.mimeType=image/jpeg
      - 真实 Web 下载返回 HTTP 200、Content-Type image/jpeg、JPEG 文件头 ffd8

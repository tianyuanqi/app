p0_closure:
  V1-BE-GAP-001:
    status: closed
    evidence: 目标 Mutation 已接入事务内持久化；覆盖合法性、24 小时或验证码 10 分钟保留、同载荷重放、异载荷冲突、并发唯一性、最多等待 10 秒以及 ETag/Location 重放。
  V1-BE-GAP-002:
    status: partially_closed
    evidence: 已发布闭合顶层 ErrorCode、通用 ErrorResult、成功泛型 Schema、认证、Idempotency-Key、If-Match、ETag 及通用错误响应。
    remaining: 当前 OpenAPI 使用按 Header/权限推导的通用错误响应；尚未把最终差异包中的逐 Operation ErrorCode 子集物化为各响应的受限 Schema，部分 DTO Validation 仍只有宽松上限。
  V1-BE-GAP-003:
    status: partially_closed
    evidence: 测试从 9 增至 17，新增幂等重放/冲突/并发、强 ETag 三类失败、管理权限顺序、ADR 0006 OpenAPI 和空库 V1～V14。
    remaining: 认证 Session 全链、全部作品/审核状态机、Mutation 后 ETag 变化、稳定分页和防枚举的完整集成矩阵尚未实现。

blocking_gaps:
  - id: V1-BE-GAP-001
    priority: P0
    area: idempotency
    summary: 已关闭；保留本条用于审计索引。
  - id: V1-BE-GAP-002
    priority: P0
    area: contract
    summary: 部分关闭；通用 Schema 和 Header 已发布，但逐 Operation ErrorCode 受限 Schema 与部分 DTO Validation 尚未闭合。
  - id: V1-BE-GAP-003
    priority: P0
    area: testability
    summary: 部分关闭；当前 17 个测试已覆盖 P0 协议核心，但完整认证、状态机、分页和防枚举集成矩阵仍缺失。
  - id: V1-BE-GAP-004
    priority: P1
    area: exif
    summary: 尚未实现 EXIF 提取、逐图拍摄时间覆盖、未来 EXIF 警告及 Asia/Shanghai 序列化闭环。
  - id: V1-BE-GAP-005
    priority: P1
    area: mail
    summary: 仅有本地 Mail Sink；生产邮件 Port 未接入真实 Provider。
  - id: V1-BE-GAP-006
    priority: P1
    area: media_cleanup
    summary: 媒体处理、失败重试和基础删除已实现，但孤儿对账、跨 DB/文件补偿、彻底清理证据及 Worker 确定性尚未完整验证。
  - id: V1-BE-GAP-007
    priority: P1
    area: response_compatibility
    summary: 管理员彻底删除返回类型、头像裁剪参数等消费者细节仍需按冻结目标契约补齐并复审。
  - id: V1-BE-GAP-008
    priority: P2
    area: persistence
    summary: 复合主键实体启动时仍有 MyBatis-Plus 无 TableId 警告，必须持续禁止误用 ById API。
  - id: V1-BE-GAP-009
    priority: P2
    area: security_hardening
    summary: 启动日志仍出现未使用的 Spring 默认内存用户密码，生产加固前应移除默认认证 Bean。

